name: Build Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Platform wheels to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - sdist
          - publish_existing
      source_run_ids:
        description: "For target=publish_existing: comma or whitespace separated run IDs containing wheel and sdist artifacts"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_wheels:
    name: Build ${{ matrix.artifact }} wheels
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
            cibw_arch: arm64
          - os: macos-15-intel
            artifact: macos-x86_64
            cibw_arch: x86_64

    steps:
      - name: Check out repository
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'macos'
        uses: actions/checkout@v4

      - name: Set up Python
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'macos'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'macos'
        run: |
          python -m pip install --upgrade pip "cibuildwheel>=3"

      - name: Build wheels
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'macos'
        env:
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: >-
            python -c "import plate_rod_thinning._c_backend;
            print('compiled backend import ok')" &&
            python -m pytest {project}/tests -q
          PLATE_ROD_BUILD_EXT: "1"
        run: python -m cibuildwheel --output-dir dist

      - name: Upload wheel artifacts
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'sdist'
        uses: actions/checkout@v4

      - name: Set up Python
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'sdist'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'sdist'
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'sdist'
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish
    needs:
      - build_wheels
      - build_sdist
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'publish_existing')
    permissions:
      id-token: write
      contents: write
      actions: read
    environment:
      name: pypi
      url: https://pypi.org/p/plate-rod-thinning

    steps:
      - name: Download wheel artifacts
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'publish_existing'
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'publish_existing'
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Download artifacts from source runs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'publish_existing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_IDS: ${{ inputs.source_run_ids }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_RUN_IDS//[[:space:],;]/}" ]]; then
            echo "source_run_ids is required when target=publish_existing" >&2
            exit 1
          fi
          mkdir -p dist artifact-zips
          normalized_ids="$(printf '%s\n' "${SOURCE_RUN_IDS}" | tr ',;' '  ')"
          for run_id in ${normalized_ids}; do
            echo "Inspecting artifacts from run ${run_id}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --paginate \
              --jq '.artifacts[] | select(.expired == false and (.name == "sdist" or (.name | startswith("wheels-")))) | [.id, .name] | @tsv' \
              > "artifact-zips/${run_id}.tsv"
            if [[ ! -s "artifact-zips/${run_id}.tsv" ]]; then
              echo "No active wheel/sdist artifacts found for run ${run_id}" >&2
              exit 1
            fi
            while IFS=$'\t' read -r artifact_id artifact_name; do
              zip_path="artifact-zips/${run_id}-${artifact_name}.zip"
              echo "Downloading ${artifact_name} (${artifact_id})"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zip_path}"
              unzip -o "${zip_path}" -d dist
            done < "artifact-zips/${run_id}.tsv"
          done

      - name: Set up Python for package checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug artifact inventory
        run: |
          ls -lah dist
          ls -1 dist/*.whl
          ls -1 dist/*.tar.gz

      - name: Twine check
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

      - name: Upload distributions to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
