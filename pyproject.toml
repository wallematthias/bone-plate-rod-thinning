[build-system]
requires = ["setuptools>=68", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-rod-thinning"
version = "0.1.7"
description = "Topology-preserving trabecular bone plate/rod skeletonization and morphometry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bone-imaging-derivatives>=0.1.4",
  "numpy",
  "scipy",
]

[project.scripts]
plate-rod-thinning = "plate_rod_thinning.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
plate_rod_thinning = ["metal/*.swift"]

[tool.setuptools.packages.find]
include = ["plate_rod_thinning*"]
